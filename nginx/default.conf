# Frontend nginx: serves the built React SPA and proxies the API.
# Sits behind your external reverse proxy (which terminates TLS for taxi.mmck.lk).
server {
    listen 80;
    server_name _;

    # Allow driver-document / vehicle-photo uploads through.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API calls -> the .NET API container. Path is preserved, so the browser's
    # /api/auth/login reaches the API as /api/auth/login.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route returns index.html so client-side
    # routing (react-router) works on deep links / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
